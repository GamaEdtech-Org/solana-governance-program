[toolchain]

[features]
seeds = false
skip-lint = false

[programs.localnet]
solana_program = "9F77hJsRRXs7vF9UDncZKth2r5wEPgcRkEfyoZDNQ3eK"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "authority-wallet.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
init-stats = "ts-node scripts/init-stats.ts"
realloc-stats = "ts-node scripts/realloc-stats.ts"
close-stats = "ts-node scripts/close-stats.ts"
init-vault = "ts-node scripts/init-vault.ts"
init-reward = "ts-node scripts/init-reward.ts"
